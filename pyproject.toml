[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-balance-monitor"
version = "1.0.0"
description = "A privacy-conscious Windows desktop monitor for DeepSeek API balances."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MoeWu" }]
dependencies = [
    "requests==2.34.2",
    "Pillow==12.3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.scripts]
deepseek-balance-monitor = "deepseek_balance_monitor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.data-files]
"share/deepseek-balance-monitor" = ["assets/deepseek_icon.ico"]

[tool.setuptools.packages.find]
where = ["src"]
