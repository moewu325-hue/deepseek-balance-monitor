name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install project
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile sources
        run: python -m compileall -q src deepseek_monitor.py

      - name: Import package
        run: python -c "import deepseek_balance_monitor; import deepseek_balance_monitor.cli"

      - name: Check command help
        run: deepseek-balance-monitor --help

      - name: Check missing-credential exit code
        shell: pwsh
        run: |
          deepseek-balance-monitor --check
          if ($LASTEXITCODE -ne 1) { exit 1 }
          exit 0
